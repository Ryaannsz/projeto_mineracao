services:
  oracle:
    build:
      context: .
      dockerfile: docker/oracle/Dockerfile
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Oracle123}
      APP_USER: ${ORACLE_USER:-petshop}
      APP_USER_PASSWORD: ${ORACLE_USER_PASSWORD:-Petshop123}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petshop_itabuna}
      POSTGRES_USER: ${POSTGRES_USER:-petshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Postgres123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-olap:
    build:
      context: .
      dockerfile: docker/olap/Dockerfile
    environment:
      POSTGRES_DB: ${OLAP_POSTGRES_DB:-petshop_olap}
      POSTGRES_USER: ${OLAP_POSTGRES_USER:-petshop}
      POSTGRES_PASSWORD: ${OLAP_POSTGRES_PASSWORD:-Olap123}
    ports:
      - "${OLAP_POSTGRES_PORT:-5433}:5432"
    volumes:
      - olap_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    # MongoDB 7 evita a incompatibilidade conhecida do MongoDB 8 com kernel Linux 6.19.
    image: docker.io/library/mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-Mongo123}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"if (db.adminCommand('ping').ok !== 1) { quit(1) }\""]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb-loader:
    build:
      context: .
      dockerfile: docker/mongodb-loader/Dockerfile
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-Mongo123}@mongodb:27017/?authSource=admin
      MONGODB_DATABASE: ${MONGO_DATABASE:-petshop_feira}
    restart: on-failure:3

volumes:
  oracle_data:
  postgres_data:
  mongo_data:
  olap_data:
