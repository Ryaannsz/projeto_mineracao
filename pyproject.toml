[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "petshop-etl"
version = "0.1.0"
description = "Extracao e preparacao de dados do Pet Shop Nosso Aumigo para OLAP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "oracledb>=2.5,<4",
    "psycopg[binary]>=3.2,<4",
    "pymongo>=4.10,<5",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
mineracao-dados = "cli:main"

[tool.setuptools]
py-modules = ["bootstrap", "cli", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "infrastructure*", "models*", "repositories*", "services*"]
